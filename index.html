<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="" data-meta="description">
<meta name="robots" content="noindex,nofollow">
<title data-text="title"></title>
<link rel="stylesheet" href="./assets/styles.css">
<link rel="stylesheet" href="./assets/page.css">
<script defer src="./content/texts.js"></script>
<script defer src="./content/page.js"></script>
<script defer src="./assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main" data-text="skip"></a>
<header><nav data-aria="navigation"><a class="brand" href="#" data-text="brand"></a><div class="navlinks"><a href="#letter" data-text="navLetter"></a><a href="#supporters" data-text="navSupport"></a><a href="#about" data-text="aboutTitle"></a><a href="#sign" data-text="navSign"></a></div></nav></header>
<main id="main">
<section class="hero" aria-labelledby="hero-title"><div class="wrap"><span class="badge" data-text="badge"></span><p class="eyebrow" data-text="campaign"></p><h1 id="hero-title" data-text="headline"></h1><p class="lead" data-text="intro"></p><div class="actions"><a class="button" href="#letter" data-text="read"></a><a class="button secondary" href="#sign" data-text="how"></a></div><p class="small muted" data-text="draftNote"></p></div></section>
<section class="section" id="story"><div class="wrap reading"><p class="eyebrow" data-text="storyEyebrow"></p><h2 data-text="campaignStoryTitle"></h2><p data-text="storyBody"></p><h3 data-text="shareTitle"></h3><p data-text="shareBody"></p><button type="button" class="button secondary" id="share" data-text="shareButton"></button><p id="share-status" class="small" role="status"></p></div></section>
<section class="section" id="letter"><article class="wrap reading"><p class="eyebrow" data-text="letterEyebrow"></p><h2 data-text="letterTitle"></h2><p class="muted preline" data-text="recipient"></p><div data-list="letterParagraphs" data-item="p"></div><h3 data-text="demandsTitle"></h3><ol data-list="demands" data-item="li"></ol><p data-text="delivery"></p><p class="small muted" data-text="version"></p><a class="button" href="#sign" data-text="support"></a><blockquote class="quote"><span data-text="quote"></span><br><span class="small" data-text="quoteNote"></span></blockquote></article></section>
<section class="section white" id="sign"><div class="wrap grid"><div><p class="eyebrow" data-text="formEyebrow"></p><h2 data-text="formTitle"></h2><p data-text="formIntro"></p><p class="placeholder small" data-text="formSetup"></p><p class="small muted" data-text="formPrivacy"></p></div><form class="card fields" id="demo-form" aria-describedby="form-note"><p class="badge" id="form-note" data-text="formBadge"></p><label><span data-text="nameLabel"></span><input name="fullName" required disabled data-placeholder="namePlaceholder" autocomplete="off"></label><label><span data-text="emailLabel"></span><input name="email" type="email" required disabled data-placeholder="emailPlaceholder" autocomplete="off"></label><label><span data-text="facultyLabel"></span><input name="faculty" required disabled data-placeholder="facultyPlaceholder" autocomplete="off"></label><label><span data-text="statusLabel"></span><select name="status" required disabled id="status-options"></select></label><label><span data-text="commentLabel"></span><textarea name="comment" rows="4" maxlength="2000" disabled data-placeholder="commentPlaceholder"></textarea></label><p class="small muted" data-text="commentPrivacy"></p><label class="check"><input type="checkbox" disabled><span data-text="consentProcessing"></span></label><label class="check"><input type="checkbox" disabled><span data-text="consentPublication"></span></label><button class="button" type="button" id="demo-button" data-text="demoButton"></button><p class="small" id="demo-status" role="status"></p></form></div></section>
<section class="section" id="supporters"><div class="wrap"><p class="eyebrow" data-text="supportersEyebrow"></p><h2 data-text="supportersTitle"></h2><p data-text="supportersIntro"></p><p class="stat" data-text="count"></p><p class="muted" data-text="countNote"></p><ul class="signers" id="signers" data-aria="signersAria"></ul><p class="small muted" data-text="refreshNote"></p></div></section>
<section class="section white" id="about"><div class="wrap reading"><p class="eyebrow" data-text="aboutEyebrow"></p><h2 data-text="aboutTitle"></h2><p data-text="aboutBody"></p><p><span data-text="emailContactLabel"></span><br><a id="organizers-email" data-text="organizersEmail"></a></p><p class="small muted" data-text="aboutNote"></p></div></section>
</main>
<footer><div class="wrap"><p class="brand" data-text="footerBrand"></p><p class="small" data-text="footerNote"></p></div></footer><a class="button mobile-cta" href="#sign" data-text="mobileSupport"></a>
</body>
</html>
